name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/*/package.json"
      - "packages/*/CHANGELOG.md"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release App token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.release-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        id: changesets
        with:
          github-token: ${{ steps.release-token.outputs.token }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          create-github-releases: true
          push-git-tags: true
      - name: Enable release PR auto-merge
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr merge "$RELEASE_PR_NUMBER" --auto --squash
